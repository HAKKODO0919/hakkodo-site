<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作り手について</title>
<link rel="stylesheet" href="../assets/style.css">
<script>
  // ブラウザの「前回のスクロール位置を復元する」機能を無効にし、
  // このページは常に最上部から表示されるようにする(このページだけの対策)。
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }
</script>
</head>
<body>
  <div id="global-nav-root"></div>
  <header class="site-header">
    <a href="../index.html" class="recipe-btn" data-i18n="homeLink">← トップにもどる</a>
    <div id="lang-switcher-root" class="lang-switcher"></div>
  </header>

  <main class="page">
    <div id="creator-profile-root" class="about-creator"></div>
  </main>

  <script src="../data/aka-miso.js"></script>
  <script src="../assets/i18n.js"></script>
  <script src="../assets/product.js"></script>
  <script src="../assets/nav.js"></script>
  <script>
    function render() {
      const lang = getCurrentLang();
      applyUiStrings(lang);
      document.title = t("navAbout", lang);
      const tr = window.PRODUCT_DATA.translations[lang] || window.PRODUCT_DATA.translations.ja;
      const root = document.getElementById("creator-profile-root");
      if (tr && tr.creator) {
        root.innerHTML = `<div class="creator-card">${renderCreatorProfile(tr.creator, "../", lang)}</div>`;
      }
    }
    renderGlobalNav(document.getElementById("global-nav-root"), "../", "about");
    renderLangSwitcher(document.getElementById("lang-switcher-root"), render);
    render();

    // 上のscrollRestoration設定だけでは防げない場合の保険として、
    // 読み込みのいろいろなタイミングで明示的に最上部へ戻す(このページだけの対策)。
    // pageshowはブラウザが前回の表示状態(bfcache)を復元した場合にも
    // 発火するため、load/DOMContentLoadedだけでは防げないケースもカバーする。
    function scrollToTopNow() {
      window.scrollTo(0, 0);
    }
    scrollToTopNow();
    document.addEventListener("DOMContentLoaded", scrollToTopNow);
    window.addEventListener("load", scrollToTopNow);
    window.addEventListener("pageshow", scrollToTopNow);
    requestAnimationFrame(scrollToTopNow);
  </script>
</body>
</html>
