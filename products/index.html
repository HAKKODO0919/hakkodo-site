<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品一覧</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
  <header class="home-header">
    <div id="global-nav-root"></div>
    <div id="lang-switcher-root" class="lang-switcher"></div>
  </header>

  <main class="page">
    <div class="intro">
      <h1 data-i18n="productsTitle">商品</h1>
      <p data-i18n="productsIntro"></p>
    </div>

    <div id="product-list-root" class="card-list">...</div>
  </main>

  <footer class="global-footer" id="global-footer-root"></footer>

  <script src="../data/aka-miso.js"></script>
  <script>window.PRODUCT_AKA_MISO = window.PRODUCT_DATA;</script>
  <script src="../assets/i18n.js"></script>
  <script src="../assets/product.js"></script>
  <script src="../assets/nav.js"></script>
  <script>
    renderGlobalNav(document.getElementById("global-nav-root"), "../", "products");
    renderGlobalFooter(document.getElementById("global-footer-root"), "../");
    // 商品を1件追加したら、ここに
    // { href: "商品名/index.html", data: window.PRODUCT_DATA相当 }
    // の形で1行増やしていきます。
    initProductList([
      { href: "miso/index.html", data: window.PRODUCT_AKA_MISO }
    ], "../");
  </script>
</body>
</html>
