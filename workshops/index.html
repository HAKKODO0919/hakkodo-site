<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワークショップ</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="global-nav-root"></div>
  <header class="site-header">
    <a href="../index.html" class="recipe-btn" data-i18n="homeLink">← トップにもどる</a>
    <div id="lang-switcher-root" class="lang-switcher"></div>
  </header>

  <main class="page">
    <div class="intro">
      <h1 data-i18n="workshopsTitle">ワークショップ</h1>
      <p data-i18n="workshopsIntro"></p>
    </div>

    <div class="intro">
      <p><a href="schedule/index.html" class="recipe-btn" data-i18n="workshopsScheduleLink">開催スケジュールを見る</a></p>
    </div>
  </main>

  <script src="../assets/i18n.js"></script>
  <script src="../assets/product.js"></script>
  <script src="../assets/nav.js"></script>
  <script>
    function render() {
      const lang = getCurrentLang();
      applyUiStrings(lang);
      document.title = t("workshopsTitle", lang);
    }
    renderGlobalNav(document.getElementById("global-nav-root"), "../", "workshops");
    renderLangSwitcher(document.getElementById("lang-switcher-root"), render);
    render();
  </script>
</body>
</html>
