  <script>
    // 商品データ(data/aka-miso.js)にすでにある文章・写真だけを再利用して、
    // トップページの「味噌・こだわり」欄を作る。新しい文章は作らず、
    // 商品ページと同じ内容をそのまま流用している。
    function renderHomeContent(lang) {
      const data = window.PRODUCT_DATA;
      const tr = data.translations[lang] || data.translations.ja;

      const lead = (tr.story && tr.story.closing && tr.story.closing.main) || "";
      document.getElementById("home-intro-lead").innerHTML = escapeText(lead);

      document.getElementById("home-feature-miso-text").innerHTML = escapeText(tr.tagline || "");
    }

    function render() {
      const lang = getCurrentLang();
      applyUiStrings(lang);
      renderHomeContent(lang);
    }
    renderGlobalNav(document.getElementById("global-nav-root"), "/", "top");
    renderGlobalFooter(document.getElementById("global-footer-root"), "/");
    renderLangSwitcher(document.getElementById("lang-switcher-root"), render);
    render();
  </script>
