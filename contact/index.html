<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Contacte amb HAKKODO: per a consultes, es pot escriure per correu electrònic.">
<link rel="canonical" href="https://hakkodo.cat/contact/">
<title>お問い合わせ</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="home-header">
    <div id="global-nav-root"></div>
    <div id="lang-switcher-root" class="lang-switcher"></div>
  </header>

  <main class="page">
    <div class="intro intro-mid">
      <p data-i18n="contactIntro"></p>
      <p class="contact-email"><a href="mailto:hakkodo.arigato@gmail.com">✉ hakkodo.arigato@gmail.com</a></p>
    </div>
  </main>

  <footer class="global-footer" id="global-footer-root"></footer>

  <script src="../assets/i18n.js"></script>
  <script src="../assets/product.js"></script>
  <script src="../assets/nav.js"></script>
  <script>
    function render() {
      const lang = getCurrentLang();
      applyUiStrings(lang);
      document.title = t("contactTitle", lang);
    }
    renderGlobalNav(document.getElementById("global-nav-root"), "../", "contact");
    renderGlobalFooter(document.getElementById("global-footer-root"), "../");
    renderLangSwitcher(document.getElementById("lang-switcher-root"), render);
    render();
  </script>
</body>
</html>
